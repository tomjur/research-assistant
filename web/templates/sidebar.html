{% for project in projects %}
<div class="sidebar-project">
  <h4 class="project-name">{{ project.name }}</h4>
  <ul class="task-list">
    {% for task in project.tasks %}
    <li class="task-item {{ task.status }}"
        hx-get="/api/task/{{ project.name }}/{{ task.tldr }}"
        hx-target="#main-panel"
        hx-swap="innerHTML"
        hx-push-url="false">
      <span class="status-dot {{ task.status }}" title="{{ task.status }}"></span>
      <span class="task-name">{{ task.tldr }}</span>
      <span class="status-label">{{ task.status }}</span>
    </li>
    {% endfor %}
  </ul>
</div>
{% endfor %}
{% if not projects %}
<p class="no-data">No research projects found in outputs/</p>
{% endif %}
