[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "research-assitant"
version = "0.0.0"
description = "Research automation helpers (local scripts)"
readme = "AGENTS.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
web = ["flask>=3.0", "pyyaml>=6.0", "markdown>=3.6"]

[tool.setuptools.packages.find]
include = ["web*"]

[tool.pytest.ini_options]
testpaths = [".agents/skills"]
